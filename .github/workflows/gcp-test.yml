name: Deploy policy_simulation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: prestij-khairunnisa-policy
          workload_identity_provider: projects/9576107772/locations/global/workloadIdentityPools/github-actions-pool/providers/github
          service_account: github-actions-policy@prestij-khairunnisa-policy.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t asia-southeast1-docker.pkg.dev/prestij-khairunnisa-policy/policy-simulation/policy-simulation:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            asia-southeast1-docker.pkg.dev/prestij-khairunnisa-policy/policy-simulation/policy-simulation:${{ github.sha }}

      - name: Deploy to policy-docker-vm
        run: |
          gcloud compute ssh jothikannan2009@policy-docker-vm \
            --zone=asia-southeast1-b \
            --tunnel-through-iap \
            --command="
              docker pull asia-southeast1-docker.pkg.dev/prestij-khairunnisa-policy/policy-simulation/policy-simulation:${{ github.sha }};
              docker stop policy_simulation || true;
              docker rm policy_simulation || true;
              docker run -d \
                --name policy_simulation \
                -p 8002:8002 \
                --env-file /opt/policy_simulation/.env \
                -v /opt/policy_simulation/outputs:/app/outputs \
                asia-southeast1-docker.pkg.dev/prestij-khairunnisa-policy/policy-simulation/policy-simulation:${{ github.sha }}
            "

      - name: Verify deployment
        run: |
          gcloud compute ssh jothikannan2009@policy-docker-vm \
            --zone=asia-southeast1-b \
            --tunnel-through-iap \
            --command="
              docker ps --filter name=policy_simulation;
              docker logs --tail 20 policy_simulation
            "
